<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101f"><title>이륙 후에 열어 - 예별이</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18365c,#07101f 48%,#030711);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif}#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.s{width:min(720px,100%)}.c{background:#0d1a31;border:1px solid #ffffff1a;border-radius:26px;padding:25px;box-shadow:0 20px 60px #0008}.center{text-align:center}.e{font-size:12px;letter-spacing:.14em;color:#66d9ff;font-weight:800}.t{font-size:clamp(36px,10vw,58px);line-height:1.02;font-weight:950;margin:10px 0 16px}.b{font-size:25px;font-weight:850;line-height:1.4}.sub{color:#b5c0d2;line-height:1.8}.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;margin-top:13px;background:#fff;color:#07101f;font-size:16px;font-weight:850}.alt{background:#172944;color:#fff;border:1px solid #345073}.ticket{background:#f7f2e9;color:#0b1730;border-radius:20px;padding:20px;margin:18px 0;text-align:left}.route{display:flex;justify-content:space-between;align-items:center;margin:20px 0 25px}.code{font-size:38px;font-weight:950}.small{font-size:11px;color:#7c8492}.tr{border-top:2px dashed #c6bfae;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.v{font-weight:850;margin-top:3px}.stamp{display:inline-block;border:2px solid #ff8fb1;color:#ff8fb1;padding:8px 12px;border-radius:8px;font-weight:900}.prog{height:13px;background:#18263c;border-radius:99px;overflow:hidden;margin:8px 0}.bar{height:100%;background:linear-gradient(90deg,#66d9ff,#69e0a8)}.log{background:#050b15;border-radius:14px;padding:15px;font-family:monospace;font-size:13px;line-height:1.8;min-height:150px;color:#cad6e8}.timeline{border-left:2px solid #29415f;padding-left:20px;margin:20px 0}.era{margin:20px 0}.era h3{margin:0 0 5px}.era p{margin:0;color:#b5c0d2;line-height:1.65}.letter{font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:17px;line-height:2;white-space:pre-line;color:#fff7ec}.memory{padding:20px;border-radius:18px;background:#142744;margin:12px 0}.heart{font-size:54px}
</style></head><body><div id="app"></div><script>
var A=document.getElementById("app");
function S(x){A.innerHTML='<div class="s">'+x+'</div>';scrollTo(0,0)}
function cover(){S('<div class="c"><div class="center"><div style="font-size:55px">✈️</div><div class="e">BBOOPPA AIRLINES · IN-FLIGHT SPECIAL</div><div class="t">BOARDING<br>PASS</div></div><div class="ticket"><b>BBOOPPA AIRLINES</b><div class="route"><div><div class="code">ICN</div><div class="small">SEOUL · KOREA</div></div><div style="font-size:28px">✈︎</div><div style="text-align:right"><div class="code">AUS</div><div class="small">AUSTRALIA</div></div></div><div class="tr"><div><div class="small">PASSENGER</div><div class="v">KIM YEBYEOL · 예별이</div></div><div><div class="small">CREW</div><div class="v">채원이 · 태굥이</div></div><div><div class="small">FLIGHT</div><div class="v">BBOOPPA 01</div></div><div><div class="small">STATUS</div><div class="v">DEPARTED ♡</div></div></div></div><div class="center"><div class="stamp">본 콘텐츠는 이륙 후 이용 가능합니다</div><p class="sub">예별이 전용 · 뿌빠 제작</p><button class="btn" onclick="verify()">여행 시작하기 →</button></div></div>')}
function verify(){S('<div class="c"><div class="e">STEP 01 · USER VERIFICATION</div><div class="b">본인이 예별이 맞습니까?</div><p class="sub">고1 때부터 채원이랑 친했고, 태굥이까지 셋이 모이면 뿌빠뿌빠. 맨날 뭘 빼먹지만 결국 다시 찾는 럭키걸.</p><button class="btn" onclick="test()">네, 예별이입니다</button><button class="btn alt" onclick="alert(\'예별이 전용 파일입니다.\')">아닌데요</button></div>')}
function test(){S('<div class="c"><div class="e">STEP 02 · SURVIVAL TEST</div><div class="b">호주 생존 능력 사전 점검</div><p class="sub"><b>Q.</b> 공항에서 뭔가 하나 빠뜨린 것 같은 기분이 든다.</p><button class="btn alt" onclick="ans(0)">침착하게 확인한다</button><button class="btn alt" onclick="ans(0)">뭘 빠뜨렸는지 모르지만 찾는다</button><button class="btn alt" onclick="ans(1)">괜찮다. 럭키걸이라 다시 찾는다</button></div>')}
function ans(x){S('<div class="c center"><div class="heart">🍀</div><div class="b">'+(x?'정답. 예별이 행동 패턴과 99.9% 일치.':'결국 럭키걸 모드가 작동할 예정입니다.')+'</div><button class="btn" onclick="stats()">분석 계속</button></div>')}
function st(n,v){return '<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-weight:750"><span>'+n+'</span><span>'+v+'%</span></div><div class="prog"><div class="bar" style="width:'+v+'%"></div></div></div>'}
function stats(){S('<div class="c"><div class="e">STEP 03 · SYSTEM REPORT</div><div class="b">예별이 능력치 분석</div>'+st("새로운 곳에 뛰어드는 용기",96)+st("상냥함",98)+st("덤덤한 척하면서 섬세함",99)+st("도전 정신",97)+st("물건 안 잃어버리기",21)+st("잃어버린 거 다시 찾기",100)+'<button class="btn" onclick="install()">워홀 패치 설치</button></div>')}
function install(){S('<div class="c"><div class="e">STEP 04 · INSTALLING</div><div class="b">Australia Life Patch 설치 중...</div><div class="prog"><div id="bar" class="bar" style="width:0"></div></div><div id="pct" class="center b">0%</div><div id="log" class="log"></div></div>');var p=0,i=0,L=["여권 확인... OK","용기 모듈... MAX","호주 교환학생 기억... FOUND","남자친구 만나러 갈 추진력... MAX","뿌빠 원격지원... READY","분실물 회수 행운 패치... ENABLED"],bar=document.getElementById("bar"),pct=document.getElementById("pct"),log=document.getElementById("log");var q=setInterval(function(){p=Math.min(100,p+10);bar.style.width=p+"%";pct.innerHTML=p+"%";if(i<L.length&&p>i*16)log.innerHTML+="&gt; "+L[i++]+"<br>";if(p===100){clearInterval(q);setTimeout(err,600)}},220)}
function err(){S('<div class="c center"><div class="e" style="color:#ff8b9a">CRITICAL ERROR</div><div class="t">문제 발견</div><div class="b">한국에 두고 온 친구 2명이 감지됨.</div><p class="sub">채원이 · 태굥이<br>거리 증가에 따라 보고싶음 수치가 상승할 예정입니다.</p><button class="btn" onclick="timeline()">복구 시도</button></div>')}
function timeline(){S('<div class="c"><div class="e">BBOOPPA ARCHIVE · TIMELINE</div><div class="b">짧고 굵게, 얇고 길게.</div><div class="timeline"><div class="era"><h3>고등학생 우리</h3><p>짧고 굵게 붙어 지내며 뿌빠의 기반을 구축하던 시절.</p></div><div class="era"><h3>성인이 된 우리</h3><p>매일 붙어 있진 않아도 얇고 길게, 편안하게 이어진 시간.</p></div><div class="era"><h3>그리고 지금</h3><p>예별이는 호주로. 채원이와 태굥이는 한국에서 원격 뿌빠 모드로.</p></div><div class="era"><h3>다음 장</h3><p>각자의 다채로운 삶을 살다가 다시 아무렇지 않게 만나기.</p></div></div><button class="btn" onclick="memory()">추억 백업 확인</button></div>')}
function memory(){S('<div class="c"><div class="e">BBOOPPA MEMORY BACKUP</div><div class="b">고1부터 지금까지</div><div class="memory">짧고 굵었던 고딩 시절 ✓</div><div class="memory">얇고 길게 이어진 성인 시절 ✓</div><div class="memory">같이 웃고 먹고 떠들었던 시간 ✓</div><div class="memory">언제든 돌아올 수 있는 편안함 ✓</div><p class="sub">사진 백업은 다음 업데이트에서 연결 예정. 중요한 기억 데이터는 이미 저장되어 있음.</p><button class="btn" onclick="letter()">마지막 파일 열기</button></div>')}
function letter(){S('<div class="c"><div class="e">LETTER_FROM_CHAEWON.TXT</div><div class="letter">안뇽 예별이..\n호주로 떠나는 널 생각하며\n그간 짧고 굵게 함께했던 고딩때와 얇고 길게 함께해온 성인인 우리들에 대해 종종 생각해보곤해 ..\n전에도 말했듯 우린 모두 덤덤이들이라 참 다행이야\n덤덤함은 여러 장단점이 있지만 최고장점은 여러 덤덤이들이 모이면 그 무엇보다 편안하단거지\n그래서인지 너와 (또 우리 뿌빠와) 있을때만큼 편한게 또 없더라..\n갖은 사건들과 만남들을 겪으면서 그 가치가 점점더 선명해지는거같아\n언제든 돌아올 수 있는 가족같달까 !\n그렇기에 각자의 다채로운 삶을 더욱 응원하게 되는 것 같아\n네게도 우리가 그러길 바라\n호주에서 많은 것을 느끼고 경험하고 돌아왔을때 또 얼마나 멋진 사람이 되어있을지 벌써 기대가 돼\n어차피 자주 연락할거니까 이정두만 할게\n건강하고!!!! 건강최고!!!! 무사히 다시만나♡♡</div><button class="btn" onclick="done()">호주에서 잘 살아남고 돌아오기</button></div>')}
function done(){S('<div class="c center"><div class="heart">🇦🇺</div><div class="e">INSTALLATION COMPLETE</div><div class="t">예별이의<br>새 챕터 시작.</div><p class="sub">Australia Working Holiday v1.0 설치 완료.<br><br>뿌빠 연결 상태: <b style="color:#69e0a8">항상 온라인</b><br>친구 잊을 확률: <b>0%</b></p><div class="stamp">건강최고!!!!</div><p class="b">잘 다녀와. 무사히 다시 만나♡</p></div>')}
cover();
</script></body></html>
