name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build gift site
        run: |
          mkdir _site
          cp index.html _site/
          cp maruihito-patch.js _site/maruihito-patch-v7.js
          cp maruihito-ui.css _site/maruihito-ui-v7.css
          cp maruihito-pwa.js manifest.webmanifest sw.js _site/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'<title>.*?</title>', '', s, count=1, flags=re.I|re.S)
          meta = '<title>MARUIHITO.exe</title><meta name="description" content="PRIVATE BUILD · USER: KIM YEBYEOL · 실행 권장"><meta property="og:title" content="MARUIHITO.exe"><meta property="og:description" content="PRIVATE BUILD · USER: KIM YEBYEOL · 실행 권장"><meta property="og:type" content="website"><meta property="og:url" content="https://ryuchaewon.github.io/for_star/"><meta name="theme-color" content="#b9ff66"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MARUIHITO"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="maruihito-ui-v7.css">'
          s = s.replace("</head>", meta + "</head>")
          s = s.replace("</body>", '<script src="maruihito-patch-v7.js"></script><script src="maruihito-pwa.js"></script></body>')
          p.write_text(s, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
